form{max-width:500px; margin:20px auto; background:white; padding:20px; border-radius:15px;}
input, select, textarea{width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc;}
button{width:100%; padding:12px; background:#d63384; color:white; border:none; border-radius:10px; cursor:pointer; font-size:16px;}
button:hover{background:#a02060;}
</style>

<body style="background-color: beige;">

<main>
<h1>Book Your Appointment</h1>
<p style="text-align:center;">Book in 30 Seconds - Instant WhatsApp Confirmation</p>

<form id="bookingForm">
<label>Full Name</label>
<input type="text" id="name" placeholder="Your name" required>

<label>WhatsApp Number</label>
<input type="tel" id="phone" placeholder="073 123 4567" required>

<label>Service Needed</label>
<select id="service" required>
<option value="">Select service</option>
<option value="Knotless Braids - R350">Knotless Braids - R350</option>
<option value="Fulani Braids - R400">Fulani Braids - R400</option>
<option value="Straight Back - R250">Straight Back - R250</option>
<option value="Straight Up - R300">Straight Up - R300</option>
<option value="Nail Set - R150">Nail Set - R150</option>
<option value="Cluster Lashes - R180">Cluster Lashes - R180</option>
<option value="Haircut - R100">Haircut - R100</option>
</select>

<label>Preferred Date</label>
<input type="date" id="date" required>

<label>Message</label>
<textarea id="message" placeholder="Any special request?"></textarea>

<button type="submit">Book via WhatsApp</button>
</form>

<p style="text-align:center; margin-top:15px;">Or Call/WhatsApp directly: <strong>073 123 4567</strong><br>Location: 10 Park Ln, Parktown, Johannesburg</p>
</main>

<footer>
<p>&copy; 2026 Mandy's Saloon - ST10527098. All rights reserved.</p>

<p id="datetime"></p>
</footer>

<script>
    function updateDateTime(){
        const now = new Date();
        const options = {weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'};
        document.getElementById('datetime').textContent = now.toLocaleDateString('en-ZA', options);
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    document.getElementById('bookingForm').addEventListener('submit', function(e){
        e.preventDefault();
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const service = document.getElementById('service').value;
        const date = document.getElementById('date').value;
        const message = document.getElementById('message').value;
        const whatsappMessage = `Hi Mandy's Saloon! I want to book at 10 Park Ln, Parktown.%0AName: ${name}%0APhone: ${phone}%0AService: ${service}%0ADate: ${date}%0AMessage: ${message}`;
        window.open(`https://wa.me/27731234567?text=${whatsappMessage}`, '_blank');
    });
</script>
<script src="JS/script.js"></script>
</body>
